[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thirsty"
version = "0.1.0"
description = "A local Qt performance controlled by a five-switch water installation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
live = ["gpiozero>=2,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
thirsty = "app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = [
  "ui/*.qml",
  "ui/qmldir",
  "ui/components/*.qml",
  "ui/components/qmldir",
  "ui/screens/*.qml",
  "ui/screens/qmldir",
  "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
