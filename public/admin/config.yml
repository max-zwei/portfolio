# Decap CMS configuration.
#
# This file MUST stay in sync with the zod schema in src/content.config.ts.
# If the two drift, the CMS writes frontmatter the Astro build then rejects.
# Field reference: docs/content-schema.md

backend:
  name: github
  repo: max-zwei/portfolio
  branch: main
  # Login on the LIVE site is deliberately not set up — and this page is not
  # even deployed (see astro.config.mjs). Editing happens locally via
  # `npx decap-server` with local_backend below. Decap's GitHub backend needs
  # an OAuth relay to complete the handshake and GitHub Pages cannot host one.
  # If that ever changes, point base_url at the relay and uncomment both lines.
  # docs/cms.md has the two routes written up.
  # base_url: https://<your-oauth-relay>
  # auth_endpoint: auth
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload "{{path}}"'
    deleteMedia: 'content: delete "{{path}}"'

# Enables `npx decap-server` for editing without any OAuth setup.
local_backend: true

# Saves open a draft PR instead of committing to main directly, so a
# half-written case study never goes live by accident.
publish_mode: editorial_workflow

media_folder: src/content/projects/_media
public_folder: ./_media

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}} ({{year}})'
    sortable_fields: [year, title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: Project name. Shown as the page heading and in listings.

      - label: How might we…
        name: hmw
        widget: string
        hint: >-
          The framing question, WITHOUT the "How might we" prefix — the site adds
          it. e.g. "make reading practice feel like play?"

      - label: Summary
        name: summary
        widget: text
        pattern: ['^.{1,280}$', 'Keep the summary under 280 characters.']
        hint: One or two sentences. Used on cards and as the meta description.

      - label: Year
        name: year
        widget: number
        value_type: int
        min: 2015
        max: 2100
        hint: Year the work was done, or started for ongoing work.

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: Reuse existing tags before inventing new ones, e.g. UX Research, EdTech.

      - label: Cover image
        name: cover
        widget: image
        required: false
        hint: Stored next to the entry so Astro can optimise it at build time.

      - label: Cover alt text
        name: coverAlt
        widget: string
        required: false
        hint: >-
          REQUIRED if a cover image is set — the build fails without it. Describe
          the image; don't repeat the title.

      - label: Figma URL
        name: figmaUrl
        widget: string
        required: false
        pattern: ['^https?://.+', 'Must be a full URL starting with http(s)://']
        hint: The Figma file or frame this was designed in.

      - label: GitHub repo URL
        name: repoUrl
        widget: string
        required: false
        pattern: ['^https?://.+', 'Must be a full URL starting with http(s)://']
        hint: Where the code lives, if the project has a repo.

      - label: Artefacts
        name: artefacts
        widget: list
        required: false
        label_singular: Artefact
        summary: '{{fields.alt}}'
        hint: >-
          Sketches, flows, screens, photos. Alt text is required on every one —
          the build fails without it.
        fields:
          - { label: Image, name: src, widget: image }
          - label: Alt text
            name: alt
            widget: string
            hint: Describe what the image shows. Not optional.

      - label: Case study
        name: body
        widget: markdown
        hint: The case study itself.
