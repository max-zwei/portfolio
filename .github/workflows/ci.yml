name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails on a new high or critical advisory. The Astro 5 scaffold shipped
      # with eight open XSS advisories and was only caught by a manual audit —
      # this is that check, made automatic.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Accessibility and HTML correctness against the real built output:
      # missing alt text, skipped heading levels, unlabelled inputs, missing
      # SRI on anything external.
      - name: Validate built HTML
        run: npm run lint:html
